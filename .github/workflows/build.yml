name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'ios/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KORE-Training.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KORE-Training-apk
          path: KORE-Training.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KORE Training (ultima versione)
          body: APK compilato automaticamente dall'ultimo commit su main. Scaricalo dal telefono e installalo.
          files: KORE-Training.apk
          make_latest: true

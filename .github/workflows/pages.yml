name: Pubblica versione iPhone

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versione della cache offline
        run: sed -i "s/const VERSION = 'kore-v1';/const VERSION = 'kore-${GITHUB_SHA::8}';/" ios/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios
      - id: deployment
        uses: actions/deploy-pages@v4
